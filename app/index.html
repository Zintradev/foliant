<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="alternate icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foliant Studio — Entorno de Escritura & Worldbuilding</title>

    <!-- Google Fonts for literary and clean UI typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Immediate Splash Screen styles before CSS/JS bundles load */
      #foliant-splash {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #09090b;
        background-image: 
          radial-gradient(circle at 50% 38%, rgba(16, 185, 129, 0.09) 0%, rgba(9, 9, 11, 0.98) 65%),
          linear-gradient(to bottom, #09090b, #050507);
        color: #f4f4f5;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        user-select: none;
        overflow: hidden;
        opacity: 1;
        transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.5s ease;
      }

      #foliant-splash.splash-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Ambient Katana Aura glow */
      .splash-glow {
        position: absolute;
        width: 280px;
        height: 280px;
        background: radial-gradient(circle, rgba(16, 185, 129, 0.2) 0%, rgba(20, 184, 166, 0.08) 40%, transparent 70%);
        border-radius: 50%;
        filter: blur(32px);
        pointer-events: none;
        animation: splashAuraPulse 3s ease-in-out infinite alternate;
      }

      @keyframes splashAuraPulse {
        0% { transform: scale(0.9); opacity: 0.5; }
        100% { transform: scale(1.12); opacity: 0.95; }
      }

      .splash-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      /* Emblem frame with katana aesthetic */
      .splash-logo-container {
        position: relative;
        width: 88px;
        height: 88px;
        margin-bottom: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 22px;
        background: linear-gradient(135deg, rgba(24, 24, 27, 0.92) 0%, rgba(9, 9, 11, 0.98) 100%);
        border: 1px solid rgba(63, 63, 70, 0.6);
        box-shadow: 
          0 10px 25px -5px rgba(0, 0, 0, 0.7),
          0 0 20px -3px rgba(16, 185, 129, 0.28),
          inset 0 1px 1px rgba(255, 255, 255, 0.12);
        animation: splashLogoFloat 3s ease-in-out infinite alternate;
      }

      @keyframes splashLogoFloat {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-4px); }
      }

      .splash-logo {
        width: 58px;
        height: 58px;
        object-fit: contain;
        filter: drop-shadow(0 2px 10px rgba(16, 185, 129, 0.35));
      }

      /* Katana blade accent sheen */
      .splash-blade-accent {
        position: absolute;
        bottom: -1px;
        left: 15%;
        right: 15%;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(52, 211, 153, 0.85), transparent);
        box-shadow: 0 0 8px rgba(52, 211, 153, 0.8);
      }

      /* Title typography */
      .splash-title {
        margin: 0 0 24px 0;
        font-family: 'Cinzel', serif, Georgia;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        background: linear-gradient(180deg, #ffffff 0%, #e4e4e7 60%, #a1a1aa 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      }

      /* Loading Progress Track with katana blade styling */
      .splash-progress-track {
        position: relative;
        width: 190px;
        height: 3px;
        background: rgba(39, 39, 42, 0.7);
        border-radius: 9999px;
        overflow: hidden;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6);
      }

      /* Katana Slash Light Beam animation */
      .splash-progress-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 35%;
        border-radius: 9999px;
        background: linear-gradient(90deg, transparent, #34d399 45%, #6ee7b7 75%, #ffffff 100%);
        box-shadow: 
          0 0 10px rgba(52, 211, 153, 0.9),
          0 0 4px rgba(255, 255, 255, 0.85);
        animation: splashKatanaSlash 1.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      @keyframes splashKatanaSlash {
        0% {
          left: -45%;
          width: 30%;
        }
        50% {
          width: 55%;
        }
        100% {
          left: 110%;
          width: 25%;
        }
      }

      /* Status indicator */
      .splash-status {
        margin-top: 14px;
        font-size: 10px;
        color: #52525b;
        letter-spacing: 0.12em;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
    </style>
  </head>

  <body class="bg-zinc-950 text-zinc-100 overflow-hidden select-none">
    <!-- Polished Katana-Themed Splash Screen -->
    <div id="foliant-splash" aria-label="Cargando Foliant">
      <div class="splash-glow"></div>
      <div class="splash-content">
        <div class="splash-logo-container">
          <img src="/logo.svg" alt="Foliant Logo" class="splash-logo" />
          <div class="splash-blade-accent"></div>
        </div>
        <h1 class="splash-title">Foliant</h1>
        <div class="splash-progress-track">
          <div class="splash-progress-bar"></div>
        </div>
        <div class="splash-status">Iniciando entorno...</div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
