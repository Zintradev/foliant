name: Build Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de la release (ej: v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write
  id-token: write     
  attestations: write

env:
  CARGO_NET_RETRY: 10
  CARGO_HTTP_MULTIPLEXING: false
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  build-windows:
    name: Build Windows (Installer & Portable)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'

      - name: Pre-fetch cargo dependencies
        shell: pwsh
        run: |
          for ($i = 1; $i -le 5; $i++) {
            cargo fetch --manifest-path src-tauri/Cargo.toml
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "Cargo fetch retry $i in 5s..."
            Start-Sleep -Seconds 5
          }

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend production assets
        run: npm run build

      - name: Build Tauri Windows application
        run: npx tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Package Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          # 1. NSIS Installer (.exe)
          $nsis = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "*.exe" | Where-Object { $_.FullName -like "*bundle\nsis\*" } | Select-Object -First 1
          if ($nsis) {
            Write-Host "Found NSIS installer: $($nsis.FullName)"
            Copy-Item $nsis.FullName "release-assets/$($nsis.Name)"
            Copy-Item $nsis.FullName "release-assets/Foliant-Windows.exe"
          } else {
            Write-Error "No NSIS installer found in src-tauri/target!"
            exit 1
          }

          # 1b. NSIS Installer Signature (.exe.sig)
          $nsisSig = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "*.exe.sig" | Where-Object { $_.FullName -like "*bundle\nsis\*" } | Select-Object -First 1
          if (-not $nsisSig) {
            $nsisSig = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "*.exe.sig" | Select-Object -First 1
          }
          if ($nsisSig) {
            Write-Host "Found NSIS signature: $($nsisSig.FullName)"
            Copy-Item $nsisSig.FullName "release-assets/$($nsisSig.Name)"
          } else {
            Write-Host "Warning: No NSIS signature (.exe.sig) found in src-tauri/target!"
          }

          # 2. MSI Installer (.msi)
          $msi = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "*.msi" | Where-Object { $_.FullName -like "*bundle\msi\*" } | Select-Object -First 1
          if ($msi) {
            Write-Host "Found MSI installer: $($msi.FullName)"
            Copy-Item $msi.FullName "release-assets/$($msi.Name)"
            Copy-Item $msi.FullName "release-assets/Foliant-Windows.msi"
          }

          # 3. Portable standalone executable (.zip)
          $exe = Get-ChildItem -Path "src-tauri/target/release" -Filter "Foliant.exe" | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path "src-tauri/target/release" -Filter "foliant.exe" | Select-Object -First 1
          }
          if ($exe) {
            Write-Host "Found standalone executable: $($exe.FullName)"
            Compress-Archive -Path $exe.FullName -DestinationPath "release-assets/Foliant-Windows-Portable.zip" -Force
          } else {
            Write-Error "No standalone Foliant.exe found in src-tauri/target/release/!"
            exit 1
          }

      - name: Upload Windows workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Foliant-Windows-Assets
          path: release-assets/*
          if-no-files-found: error

  build-macos:
    name: Build macOS (DMG & App)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'

      - name: Pre-fetch cargo dependencies with retry
        run: |
          for i in 1 2 3 4 5; do
            cargo fetch --manifest-path src-tauri/Cargo.toml && break || (echo "Cargo fetch retry $i in 5s..." && sleep 5)
          done

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend production assets
        run: npm run build

      - name: Build Tauri macOS application
        run: npx tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Package macOS artifacts
        run: |
          mkdir -p release-assets

          # 1. Locate DMG installer (.dmg)
          DMG_FILE=$(find src-tauri/target -name "*.dmg" 2>/dev/null | head -n 1)
          if [ -z "$DMG_FILE" ] || [ ! -f "$DMG_FILE" ]; then
            echo "::error ::No DMG installer found in src-tauri/target!"
            exit 1
          fi

          echo "Found DMG installer: $DMG_FILE"
          cp "$DMG_FILE" "release-assets/$(basename "$DMG_FILE")"
          cp "$DMG_FILE" "release-assets/Foliant-Mac.dmg"

          # 2. Standalone .app bundle compressed as ZIP
          APP_DIR=$(find src-tauri/target -name "*.app" -type d 2>/dev/null | head -n 1)
          if [ -n "$APP_DIR" ] && [ -d "$APP_DIR" ]; then
            echo "Found .app bundle: $APP_DIR"
            ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" release-assets/Foliant-macOS-Portable.zip
            cp release-assets/Foliant-macOS-Portable.zip release-assets/Foliant-Mac-Portable.zip 2>/dev/null || true
          fi

          # 3. Updater artifacts (.app.tar.gz and .app.tar.gz.sig)
          for f in $(find src-tauri/target -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" 2>/dev/null); do
            echo "Found updater artifact: $f"
            cp "$f" "release-assets/$(basename "$f")"
          done

          if [ ! -f "release-assets/Foliant-Mac.dmg" ]; then
            echo "::error ::release-assets/Foliant-Mac.dmg was not generated!"
            exit 1
          fi

      - name: Upload macOS workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Foliant-macOS-Assets
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Create GitHub Release & Publish Assets
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-assets
          merge-multiple: true

      - name: Generate Tauri v2 latest.json
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          node - << 'EOF'
          const fs = require('fs');
          const path = require('path');

          const assetsDir = path.resolve('all-assets');
          const files = fs.readdirSync(assetsDir);
          console.log('Available assets in all-assets:', files);

          const tag = (process.env.RELEASE_TAG || 'v0.3.2').trim();
          const tauriConf = JSON.parse(fs.readFileSync(path.resolve('src-tauri/tauri.conf.json'), 'utf8'));
          const version = tauriConf.version;
          const pubDate = new Date().toISOString();

          // 1. Windows x86_64 (.exe and .exe.sig)
          const winSigFile = files.find(f => f.endsWith('.exe.sig'));
          let windowsPlatform = null;
          if (winSigFile) {
            const expectedExe = winSigFile.replace(/\.sig$/, '');
            const winExeFile = files.includes(expectedExe)
              ? expectedExe
              : files.find(f => f.endsWith('.exe') && !f.includes('Portable'));
            if (winExeFile) {
              const signature = fs.readFileSync(path.join(assetsDir, winSigFile), 'utf8').trim();
              windowsPlatform = {
                signature,
                url: `https://github.com/Zintradev/foliant/releases/download/${tag}/${winExeFile}`
              };
              console.log(`Windows updater target: ${winExeFile}`);
            }
          } else {
            console.warn('Warning: No .exe.sig file found in all-assets');
          }

          // 2. Darwin aarch64 (.app.tar.gz and .app.tar.gz.sig)
          const macSigFile = files.find(f => f.endsWith('.app.tar.gz.sig'));
          let darwinPlatform = null;
          if (macSigFile) {
            const expectedTar = macSigFile.replace(/\.sig$/, '');
            const macTarFile = files.includes(expectedTar)
              ? expectedTar
              : files.find(f => f.endsWith('.app.tar.gz'));
            if (macTarFile) {
              const signature = fs.readFileSync(path.join(assetsDir, macSigFile), 'utf8').trim();
              darwinPlatform = {
                signature,
                url: `https://github.com/Zintradev/foliant/releases/download/${tag}/${macTarFile}`
              };
              console.log(`macOS updater target: ${macTarFile}`);
            }
          } else {
            console.warn('Warning: No .app.tar.gz.sig file found in all-assets');
          }

          const platforms = {};
          if (windowsPlatform) {
            platforms['windows-x86_64'] = windowsPlatform;
          }
          if (darwinPlatform) {
            platforms['darwin-aarch64'] = darwinPlatform;
          }

          const latestJson = {
            version,
            notes: `Foliant Release ${tag}`,
            pub_date: pubDate,
            platforms
          };

          const outPath = path.join(assetsDir, 'latest.json');
          fs.writeFileSync(outPath, JSON.stringify(latestJson, null, 2) + '\n', 'utf8');
          console.log('Generated all-assets/latest.json successfully:');
          console.log(fs.readFileSync(outPath, 'utf8'));
          EOF

      - name: Generate SHA-256 Checksums
        shell: bash
        run: |
          cd all-assets
          sha256sum * > SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'all-assets/*'
          
      - name: Publish all assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: all-assets/*
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: Foliant Release ${{ github.event.inputs.release_tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}