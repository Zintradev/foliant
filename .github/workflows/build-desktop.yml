name: Build Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de la release (ej: v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (Installer & Portable)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend production assets
        run: npm run build

      - name: Build Tauri Windows application
        run: npx tauri build

      - name: Package Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          # 1. NSIS Installer (.exe)
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($nsis) {
            Write-Host "Found NSIS installer: $($nsis.FullName)"
            Copy-Item $nsis.FullName "release-assets/$($nsis.Name)"
            # Permanent direct download name for landing page
            Copy-Item $nsis.FullName "release-assets/Foliant-Windows.exe"
          } else {
            Write-Warning "No NSIS installer found in src-tauri/target/release/bundle/nsis/"
          }

          # 2. MSI Installer (.msi)
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          if ($msi) {
            Write-Host "Found MSI installer: $($msi.FullName)"
            Copy-Item $msi.FullName "release-assets/$($msi.Name)"
          }

          # 3. Portable standalone executable (.zip)
          $exe = Get-ChildItem -Path "src-tauri/target/release" -Filter "Foliant.exe" | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path "src-tauri/target/release" -Filter "foliant.exe" | Select-Object -First 1
          }
          if ($exe) {
            Write-Host "Found standalone executable: $($exe.FullName)"
            Compress-Archive -Path $exe.FullName -DestinationPath "release-assets/Foliant-Windows-Portable.zip" -Force
          } else {
            Write-Warning "No standalone Foliant.exe found in src-tauri/target/release/"
          }

          Write-Host "Listing prepared Windows release assets:"
          Get-ChildItem -Path release-assets

      - name: Upload Windows workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Foliant-Windows-Assets
          path: release-assets/*
          if-no-files-found: warn

      - name: Publish Windows assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: release-assets/*
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: Foliant Release ${{ github.event.inputs.release_tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS (DMG & App)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend production assets
        run: npm run build

      - name: Build Tauri macOS application
        run: npx tauri build

      - name: Package macOS artifacts
        run: |
          mkdir -p release-assets

          # 1. DMG installer (.dmg)
          DMG_FILE=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" 2>/dev/null | head -n 1)
          if [ -n "$DMG_FILE" ] && [ -f "$DMG_FILE" ]; then
            echo "Found DMG installer: $DMG_FILE"
            cp "$DMG_FILE" "release-assets/$(basename "$DMG_FILE")"
            # Permanent direct download name for landing page
            cp "$DMG_FILE" "release-assets/Foliant-Mac.dmg"
          else
            echo "::warning ::No DMG installer found in src-tauri/target/release/bundle/dmg"
          fi

          # 2. Standalone .app bundle compressed as ZIP
          APP_DIR=$(find src-tauri/target/release/bundle/macos -name "*.app" 2>/dev/null | head -n 1)
          if [ -n "$APP_DIR" ] && [ -d "$APP_DIR" ]; then
            echo "Found .app bundle: $APP_DIR"
            ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" release-assets/Foliant-macOS-Portable.zip
          fi

          echo "Listing prepared macOS release assets:"
          ls -la release-assets

      - name: Upload macOS workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Foliant-macOS-Assets
          path: release-assets/*
          if-no-files-found: warn

      - name: Publish macOS assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: release-assets/*
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: Foliant Release ${{ github.event.inputs.release_tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

